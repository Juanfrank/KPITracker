name: Build Windows executable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit/integration tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build Windows executable (NSIS installer + portable)
        run: npm run package:win

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with build artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-build-${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: KPITracker Windows build ${{ steps.version.outputs.version }} (#${{ github.run_number }})
          prerelease: true
          body: |
            Ejecutable de Windows x64 generado automáticamente por GitHub Actions
            desde el commit ${{ github.sha }} en la rama `${{ github.ref_name }}`.

            Incluye:
            - `KPITracker Setup *.exe`: instalador NSIS.
            - `KPITracker *.exe` (portable): ejecutable único sin instalación.
          files: |
            release/*.exe
